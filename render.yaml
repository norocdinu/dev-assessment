# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys: Fastify API (Docker) + Next.js web (Docker), using an external
# Neon Postgres (see DATABASE_URL note below).
#
# IMPORTANT — public URLs are predicted from the service names below.
# Render assigns https://<service-name>.onrender.com IF the name is globally
# unique. If a name is already taken, Render appends a random suffix; in that
# case update NEXT_PUBLIC_API_URL and WEB_URL to the real URLs and redeploy
# (NEXT_PUBLIC_API_URL is baked at build time, so the web service must rebuild).

# Database is hosted externally on Neon (the same instance used locally), not
# on Render's managed Postgres. The connection string is a secret set in the
# Render dashboard (see DATABASE_URL below), so it is not committed here.

services:
  # ── API (Fastify) ──────────────────────────────────────────────────────────
  - type: web
    name: dev-assessment-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    envVars:
      # External Neon Postgres connection string. Set this in the Render
      # dashboard (Environment tab) — Render will prompt for it on sync.
      # Value matches DATABASE_URL in apps/api/.env (the local connection).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Used for the CORS allow-list. Must exactly match the web origin
      # (scheme + host, no trailing slash).
      - key: WEB_URL
        value: https://dev-assessment-web.onrender.com

  # ── Web (Next.js standalone) ───────────────────────────────────────────────
  - type: web
    name: dev-assessment-web
    runtime: docker
    plan: free
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    envVars:
      # Render passes env vars as Docker build args, and the web Dockerfile
      # declares `ARG NEXT_PUBLIC_API_URL` — so this is baked into the client
      # bundle at build time (the browser calls the API directly).
      - key: NEXT_PUBLIC_API_URL
        value: https://dev-assessment-api.onrender.com
